[package]
name = "chipper"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
ocrs = { version = "0.14.0", default-features = false, features = ["onnx"] }
rten = { version = "0.28.0", default-features = false, features = ["onnx_format"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "Storage",
    "Response",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "Event",
    "EventTarget",
    "MouseEvent",
    "PointerEvent",
] }
rten-imageproc = "0.28.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# OCR inference is unusably slow without optimisation, even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
